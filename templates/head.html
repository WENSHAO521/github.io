<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>{{TITLE}} | Panorama Scholarly Group Editorial Directory</title>
    <link rel="icon" href="{{BASE}}assets/logos/favicon.png" type="image/png">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "surface": "#ffffff",
              "on-surface": "#000000",
              "surface-variant": "#f9fafb",
              "outline-variant": "#e5e7eb",
            },
            fontFamily: {
              "headline": ["Fraunces", "serif"],
              "body": ["Inter", "sans-serif"],
            },
            borderRadius: {"DEFAULT": "0px", "sm": "0px", "md": "0px", "lg": "0px", "xl": "0px", "2xl": "0px", "3xl": "0px", "full": "0px"},
          },
        },
      }
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #000000; }
      ::selection { background-color: #000000; color: #ffffff; }

      h1 { font-family: 'Fraunces', serif; font-weight: 500; letter-spacing: -0.015em; }

      a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
          outline: 2px solid #000000;
          outline-offset: 3px;
      }
      a:active, button:active { text-decoration: none; }

      main a[href] { transition: transform 150ms ease, background-color 200ms ease, color 200ms ease, border-color 200ms ease; }
      main a[href]:active, main button:active { transform: scale(0.98); }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen">
